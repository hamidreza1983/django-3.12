services:
  backend:
    build: .
    container_name: django-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000
  
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - 6379:6379
    command: redis-server --save 60 1 --loglevel warning